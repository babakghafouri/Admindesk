name: Admin Desk Windows Installer Release

on:
  workflow_dispatch:
  # Build release candidates without publishing before manual verification.
  push:
    branches:
      - master
    paths:
      - ".github/workflows/admindesk-windows-release.yml"
      - ".github/workflows/flutter-build.yml"
      - ".github/scripts/sign-windows-artifacts.ps1"
      - ".github/workflows/third-party-RustDeskTempTopMostWindow.yml"
      - "flutter/lib/**"
      - "flutter/assets/**"
      - "flutter/windows/**"
      - "flutter/pubspec.yaml"
      - "res/icon.ico"
      - "src/lang/fa.rs"
      - "src/lang.rs"
      - "src/common.rs"
      - "src/client.rs"
      - "src/flutter.rs"
      - "src/flutter_ffi.rs"
      - "src/platform/windows.rs"
      - "res/admindesk/**"
      - "res/job.py"
      - "res/msi/**"

permissions:
  contents: write

concurrency:
  group: admindesk-windows-release-2.0.0
  cancel-in-progress: false

jobs:
  publish-windows-installers:
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    with:
      windows-only: true
      upload-artifact: false
      pr-preview-installers: true
      upload-tag: v2.0.0
      publish-update-metadata: false
    secrets: inherit
