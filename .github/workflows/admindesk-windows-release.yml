name: Admin Desk Windows Installer Release

on:
  workflow_dispatch:
  # Publish the next Windows preview when this workflow update lands on master.
  push:
    branches:
      - master
    paths:
      - ".github/workflows/admindesk-windows-release.yml"
      - ".github/workflows/flutter-build.yml"
      - ".github/workflows/third-party-RustDeskTempTopMostWindow.yml"
      - "flutter/lib/**"
      - "src/lang/fa.rs"
      - "src/common.rs"
      - "src/client.rs"
      - "res/admindesk/**"
      - "res/msi/**"

permissions:
  contents: write

concurrency:
  group: admindesk-windows-release-1.5.1-preview4
  cancel-in-progress: false

jobs:
  publish-windows-installers:
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    with:
      windows-only: true
      upload-artifact: true
      upload-tag: admindesk-win-v1.5.1-preview.4
      publish-update-metadata: false
    secrets: inherit
