name: Flutter Nightly Build

on:
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    # The reusable workflow includes publishing jobs with contents: write.
    # Scheduled/manual runs are trusted; this workflow has no PR trigger.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      # Only an explicit manual dispatch can start this workflow.
      upload-artifact: true
      upload-tag: "nightly"
