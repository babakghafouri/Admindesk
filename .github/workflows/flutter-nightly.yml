name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:
  # Validate this workflow's permission contract after edits without publishing.
  push:
    branches:
      - master
    paths:
      - ".github/workflows/flutter-nightly.yml"

jobs:
  run-flutter-nightly-build:
    # The reusable workflow includes publishing jobs with contents: write.
    # Scheduled/manual runs are trusted; this workflow has no PR trigger.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      # A workflow-file push is a smoke build; scheduled/manual runs publish.
      upload-artifact: ${{ github.event_name != 'push' }}
      upload-tag: "nightly"
