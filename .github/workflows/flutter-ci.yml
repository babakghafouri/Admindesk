name: Windows Flutter CI

# Manual-only diagnostic build. The dedicated AdminDesk Windows release
# workflow is the sole automatic publisher, preventing duplicate Windows builds
# and duplicate nightly/release assets on every master push.
on:
  workflow_dispatch:

jobs:
  run-ci:
    # A called reusable workflow cannot upgrade the caller's token permissions.
    # No untrusted pull_request event is used for this write-enabled build.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    with:
      # Windows-only iteration; skip macOS, Android and Linux native builds.
      windows-only: true
      upload-artifact: true
