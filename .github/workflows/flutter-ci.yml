name: Windows Flutter CI

# Full native builds require a write-capable caller token because the existing
# reusable build workflow has publishing jobs that request contents: write.
# Keep pull requests on the separate read-only CI workflow (ci.yml).
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
      - "README.md"
      - "appimage/**"
      - "flatpak/**"

jobs:
  run-ci:
    # A called reusable workflow cannot upgrade the caller's token permissions.
    # No untrusted pull_request event is used for this write-enabled build.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    with:
      # Windows-only iteration; skip macOS, Android and Linux native builds.
      windows-only: true
      upload-artifact: true
