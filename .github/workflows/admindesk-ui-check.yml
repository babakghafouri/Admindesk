name: Admin Desk UI check

on:
  push:
    branches:
      - stage4/admindesk-desktop-rtl-dashboard
    paths:
      - flutter/lib/desktop/widgets/admindesk_dashboard.dart
      - flutter/lib/desktop/pages/desktop_home_page.dart
      - flutter/lib/desktop/pages/connection_page.dart
      - flutter/lib/common/widgets/peer_tab_page.dart
      - .github/workflows/admindesk-ui-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-ui-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
      - name: Install Flutter version used by this repository
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Resolve Flutter dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Analyze modified desktop UI files
        working-directory: flutter
        run: >
          flutter analyze --no-fatal-infos
          lib/desktop/widgets/admindesk_dashboard.dart
          lib/desktop/pages/desktop_home_page.dart
          lib/desktop/pages/connection_page.dart
          lib/common/widgets/peer_tab_page.dart
