name: Admin Desk UI check

on:
  push:
    branches:
      - stage4/admindesk-desktop-rtl-dashboard
      - final/admindesk-platform-ids-and-tray
      - feature/new-ui
    paths:
      - flutter/lib/desktop/widgets/admindesk_dashboard.dart
      - flutter/lib/desktop/widgets/admindesk_sidebar.dart
      - flutter/lib/desktop/widgets/admindesk_titlebar.dart
      - flutter/lib/desktop/widgets/quick_connect_card.dart
      - flutter/lib/desktop/widgets/admindesk_credentials.dart
      - flutter/lib/desktop/widgets/devices_table.dart
      - flutter/lib/desktop/widgets/promo_carousel.dart
      - flutter/lib/desktop/widgets/tabbar_widget.dart
      - flutter/lib/desktop/pages/desktop_tab_page.dart
      - flutter/lib/desktop/theme/admindesk_theme.dart
      - flutter/lib/common/widgets/peer_card.dart
      - flutter/lib/common/widgets/peers_view.dart
      - flutter/lib/common.dart
      - flutter/assets/admindesk_promo_*.svg
      - flutter/lib/desktop/pages/desktop_home_page.dart
      - flutter/lib/desktop/pages/connection_page.dart
      - flutter/lib/common/widgets/peer_tab_page.dart
      - .github/workflows/admindesk-ui-check.yml
      - Cargo.toml
      - flutter/android/app/build.gradle
      - flutter/ios/Runner.xcodeproj/project.pbxproj
      - flutter/macos/Runner/Configs/AppInfo.xcconfig
      - flutter/linux/CMakeLists.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-ui-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
      - name: Install Flutter version used by this repository
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Resolve Flutter dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Analyze modified desktop UI files
        working-directory: flutter
        run: >
          flutter analyze --no-fatal-infos
          lib/common.dart
          lib/desktop/theme/admindesk_theme.dart
          lib/desktop/widgets/admindesk_dashboard.dart
          lib/desktop/widgets/admindesk_sidebar.dart
          lib/desktop/widgets/admindesk_titlebar.dart
          lib/desktop/widgets/quick_connect_card.dart
          lib/desktop/widgets/admindesk_credentials.dart
          lib/desktop/widgets/devices_table.dart
          lib/desktop/widgets/promo_carousel.dart
          lib/desktop/widgets/tabbar_widget.dart
          lib/desktop/pages/desktop_tab_page.dart
          lib/desktop/pages/desktop_home_page.dart
          lib/desktop/pages/connection_page.dart
          lib/common/widgets/peer_tab_page.dart
          lib/common/widgets/peer_card.dart
          lib/common/widgets/peers_view.dart
      - name: Run self-contained Flutter regression tests
        # Tests importing generated_bridge.dart require Rust/FFI code generation.
        working-directory: flutter
        run: flutter test test/input_modifier_utils_test.dart
      - name: Check platform bundle identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          expected = {
              'Cargo.toml': 'identifier = "com.babakghafouri.admindesk"',
              'flutter/android/app/build.gradle': 'applicationId "com.babakghafouri.admindesk"',
              'flutter/ios/Runner.xcodeproj/project.pbxproj': 'PRODUCT_BUNDLE_IDENTIFIER = com.babakghafouri.admindesk;',
              'flutter/macos/Runner/Configs/AppInfo.xcconfig': 'PRODUCT_BUNDLE_IDENTIFIER = com.babakghafouri.admindesk',
              'flutter/linux/CMakeLists.txt': 'set(APPLICATION_ID "com.babakghafouri.admindesk")',
          }
          for name, text in expected.items():
              assert text in (root / name).read_text(), f'{name}: branding identifier missing'
          print('Platform bundle IDs verified')
          PY
